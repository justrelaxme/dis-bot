# Продовый стек: postgres/redis с healthcheck, отдельный одноразовый сервис
# миграций (restart: "no"), бот стартует только после его успешного завершения,
# и caddy как reverse-proxy с TLS.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?требуется POSTGRES_PASSWORD}
      POSTGRES_DB: disbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bot -d disbot']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: ['node', 'dist/scripts/migrate.js']
    env_file: .env
    # DATABASE_URL/REDIS_URL из .env рассчитаны на localhost (запуск с хоста для
    # разработки) — внутри контейнера localhost означает сам контейнер. Переопределяем
    # на service-имена compose, пароль берём из той же POSTGRES_PASSWORD, что и сервис
    # postgres.
    environment:
      DATABASE_URL: 'postgres://bot:${POSTGRES_PASSWORD}@postgres:5432/disbot'
      REDIS_URL: 'redis://redis:6379'
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: 'postgres://bot:${POSTGRES_PASSWORD}@postgres:5432/disbot'
      REDIS_URL: 'redis://redis:6379'
      BACKUP_DIR: '/backups'
      # Здесь метрики включить безопасно: наружу их не пускает Caddy, а внутрь сети
      # контейнеров ходит скрейпер. На платформе без своего reverse-proxy оставьте
      # выключенными — иначе счётчики окажутся публичными.
      METRICS_ENABLED: 'true'
    volumes:
      # Отдельный том: дампы внутри контейнера исчезли бы вместе с ним при первом же
      # пересоздании, то есть при первом же обновлении бота.
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/healthz || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      # :- вместо :? — compose интерполирует весь файл до выбора сервисов, поэтому
      # :? рвал бы up/build/config для ЛЮБОГО набора сервисов (даже postgres/redis
      # без caddy). Если BOT_DOMAIN и правда нужен, но не задан, пусть ругается caddy,
      # а не compose.
      BOT_DOMAIN: "${BOT_DOMAIN:-}"
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - bot
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  backups:
  caddydata:
  caddyconfig:
