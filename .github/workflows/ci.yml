name: CI

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 4 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    # Сервисы поднимает сам runner: podman в CI не нужен, а образы те же.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: disbot_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U bot -d disbot_test"
          --health-interval 3s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:int
        env:
          DATABASE_URL_TEST: postgres://bot:bot@localhost:55432/disbot_test
          REDIS_URL_TEST: redis://localhost:56379

  contract:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:contract
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
